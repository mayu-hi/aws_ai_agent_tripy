<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ALS 旅行メモ</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="config.js"></script>
  <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>ALS 旅行メモ</h1>
      <div class="controls">
        <input id="search" class="search-box" placeholder="場所を検索（例: カフェ）" />
        <button id="btnSearch" class="btn">検索</button>
        <span class="badge visited">Visited</span>
        <span class="badge favorite">Favorite</span>
        <span class="badge recommended">Recommended</span>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    (async () => {
      const cfg = window.APP_CONFIG;
      const { region, apiKey, styleName, apiBase, language } = cfg;

      // 地図スタイル（APIキー方式）
      const styleUrl = `https://maps.geo.${region}.amazonaws.com/v2/styles/${encodeURIComponent(styleName)}/descriptor?key=${encodeURIComponent(apiKey)}`;

      const map = new maplibregl.Map({
        container: 'map',
        style: styleUrl,
        center: [139.767, 35.681], // 東京駅付近
        zoom: 12
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      // === ピン色の統一ロジック（カテゴリの揺れを吸収） ===
      const PIN_COLORS = {
        visited: '#1a73e8',
        favorite: '#fbbc04', fav: '#fbbc04', favourite: '#fbbc04',
        recommended: '#ea4335', recommend: '#ea4335', suggestion: '#ea4335',
        me: '#34a853', current: '#34a853', here: '#34a853'
      };
      function normalizeCategory(v) {
        if (!v) return 'visited';
        const k = String(v).trim().toLowerCase();
        if (PIN_COLORS[k]) return k;
        // よくある別名を吸収
        if (k.startsWith('fav')) return 'favorite';
        if (k.startsWith('rec')) return 'recommended';
        return 'recommended';
      }

      // 現在地マーカー（デフォルトのピン + color/scale で全面着色）
      const meMarker = new maplibregl.Marker({ color: PIN_COLORS.me, scale: 1.2 });

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const { latitude, longitude } = pos.coords;
          meMarker.setLngLat([longitude, latitude]).addTo(map);
          const meHtml = `<strong>現在地</strong><div style="margin-top:4px;font-size:12px;color:#666">${longitude.toFixed(5)}, ${latitude.toFixed(5)}</div>`;
          attachHoverPopup(meMarker, meHtml); // ← ホバーでポップアップ
          map.flyTo({ center: [longitude, latitude], zoom: 14 });
        });
      }

      // 共通：ピン追加（デフォルトマーカーを使用して全面を色付け）（カテゴリに応じて inline style で色を強制）
      function attachHoverPopup(marker, html) {
        // クリック不要、ホバーで出る軽量ポップアップ
        const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 24 }).setHTML(html);
        marker.setPopup(popup);
        const el = marker.getElement();
        let open = false;
        const show = () => { if (!open) { marker.togglePopup(); open = true; } };
        const hide = () => { if (open) { marker.togglePopup(); open = false; } };
        el.addEventListener('mouseenter', show);
        el.addEventListener('mouseleave', hide);
      }

      function addPin(place) {
        const cat = normalizeCategory(place.category);
        const marker = new maplibregl.Marker({ color: PIN_COLORS[cat] || '#666', scale: 1.0 })
          .setLngLat([place.lon, place.lat])
          .addTo(map);
        const desc = place.note ? `<div style=\"margin-top:4px;font-size:12px;color:#666\">${place.note}</div>` : '';
        const meta = (place.lon && place.lat) ? `<div style=\"margin-top:4px;font-size:11px;color:#999\">${place.lon.toFixed(5)}, ${place.lat.toFixed(5)}</div>` : '';
        const title = place.name || cat;
        const html = `<strong>${title}</strong>${desc}${meta}`;
        attachHoverPopup(marker, html); // ← ホバーでポップアップ
      }

      // 履歴（visited/favorite）をロードして色分けピン表示
      async function loadHistory() {
        const res = await fetch(`${apiBase}/api/history`);
        const data = await res.json();
        data.forEach(p => addPin(p));
      }

      // おすすめを取得してピン表示
      async function loadRecommendations() {
        const res = await fetch(`${apiBase}/api/recommendations`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: 'default' }) });
        const data = await res.json();
        data.forEach(p => addPin(p));
      }

      // === Places v2（APIキー）で検索 ===
      async function doSearch() {
        const q = document.getElementById('search').value.trim();
        if (!q) return;

        // 現在地を検索バイアスに
        let lat, lon;
        try {
          const loc = meMarker.getLngLat();
          lon = loc.lng; lat = loc.lat;
        } catch (e) {}

        const url = `https://places.geo.${region}.amazonaws.com/v2/search-text?key=${encodeURIComponent(apiKey)}`;
        const body = {
          QueryText: q,
          MaxResults: 10,
          Language: language || 'ja',
          IntendedUse: 'SingleUse',
          ...(lat && lon ? { BiasPosition: [lon, lat] } : {})
        };

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const txt = await res.text();
          console.error('Places API error', res.status, txt);
          alert('検索に失敗しました');
          return;
        }

        const data = await res.json();
        const items = data.ResultItems || [];

        items.forEach(item => {
          const pos = item.Position || (item.AccessPoints && item.AccessPoints[0] && item.AccessPoints[0].Position);
          if (!pos) return;
          const [plon, plat] = pos;
          const name = (item.Address && item.Address.Label) || (item.Categories && item.Categories[0] && item.Categories[0].Name) || q;
          addPin({ name, lat: plat, lon: plon, category: 'recommended' });
        });

        if (items[0]) {
          const pos = items[0].Position || (items[0].AccessPoints && items[0].AccessPoints[0] && items[0].AccessPoints[0].Position);
          if (pos) map.flyTo({ center: [pos[0], pos[1]], zoom: 14 });
        }
      }

      document.getElementById('btnSearch').addEventListener('click', doSearch);
      document.getElementById('search').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

      // 初期ロード
      await loadHistory();
      await loadRecommendations();
    })();
  </script>
</body>
</html>
